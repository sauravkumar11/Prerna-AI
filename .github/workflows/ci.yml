name: CI

on:
  push:
  pull_request:

jobs:
  backend-linux:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: test-ci-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi pydantic python-dotenv requests psutil

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run backend tests
        run: python -m pytest -q

  backend-windows:
    runs-on: windows-latest
    env:
      GEMINI_API_KEY: test-ci-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi pydantic python-dotenv requests psutil

      - name: Run Windows-focused tests
        run: |
          python -m pytest -q backend/tests/test_windows_folders.py backend/tests/test_chrome_session_bring_to_foreground.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
