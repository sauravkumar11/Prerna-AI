[pytest]
# ══════════════════════════════════════════════════════════════════════════
# Pytest Configuration for Prerna Core v1.1.1
# ══════════════════════════════════════════════════════════════════════════

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test output and verbosity
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --cov=backend
    --cov-report=term-missing:skip-covered
    --cov-report=html:backend/htmlcov
    --cov-report=xml:backend/coverage.xml
    --cov-fail-under=70
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may need external services)
    slow: Tests that take longer to run
    registry: Tests for agent/registry.py
    tools: Tests for tool implementations
    memory: Tests for memory persistence
    api: Tests for API endpoints
    dangerous: Tests that modify system state (use with caution)
    skip_ci: Skip in CI environment

# Test paths
testpaths = backend/tests

# Minimum Python version
minversion = 7.0

# Note: asyncio_mode and timeout are deprecated in latest pytest
# If using pytest-asyncio, uncomment: asyncio_mode = auto
# If using pytest-timeout, uncomment: timeout = 300

# Log settings
log_cli = false
log_cli_level = INFO
log_file = backend/tests/pytest.log
log_file_level = DEBUG

# Coverage settings
[coverage:run]
branch = True
source = backend
omit =
    */tests/*
    */test_*.py
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
