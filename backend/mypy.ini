[mypy]
# MyPy Configuration for Prerna v1.1.2
# Type checking configuration for production code quality

# Global options
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False  # Gradual typing (stricter in critical paths)
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = silent

# Per-module options
[mypy-tests.*]
ignore_errors = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-pyautogui.*]
ignore_missing_imports = True

[mypy-pyperclip.*]
ignore_missing_imports = True

[mypy-win32gui.*]
ignore_missing_imports = True

[mypy-win32con.*]
ignore_missing_imports = True

[mypy-win32process.*]
ignore_missing_imports = True

[mypy-selenium.*]
ignore_missing_imports = True

[mypy-google.genai.*]
ignore_missing_imports = True

[mypy-edge_tts.*]
ignore_missing_imports = True

# Report options
pretty = True
show_column_numbers = True
show_error_context = True
